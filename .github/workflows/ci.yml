# .github/workflows/ci.yml — DocuFlow CI/CD
#
# Stages:
#   1. lint    — ruff
#   2. test    — pytest con coverage ≥ 70%
#   3. deploy  — railway up (solo en push a main)
#
# Secrets requeridos en GitHub → Settings → Secrets and variables → Actions:
#   RAILWAY_TOKEN          → token de API de Railway (railway.app → Account → API Tokens)
#   SECRET_KEY             → valor de producción (openssl rand -hex 32)
#   OPENAI_API_KEY         → para tests de integración (opcional, se mockea)
#   ANTHROPIC_API_KEY      → si LLM_PROVIDER=anthropic

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. LINT
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check . --ignore E501,F401

  # ─────────────────────────────────────────────────────────────
  # 2. TEST
  # ─────────────────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docuflow_test
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: docuflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+psycopg2://docuflow_test:testpass@localhost:5432/docuflow_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'test-secret-key-for-ci-only' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-fake' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'test-fake' }}
      LLM_PROVIDER: openai
      APP_ENV: testing
      STRIPE_SECRET_KEY: sk_test_fake
      STRIPE_WEBHOOK_SECRET: whsec_fake
      TIMEZONE: America/Argentina/Buenos_Aires

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=70

  # ─────────────────────────────────────────────────────────────
  # 3. DEPLOY → Railway (solo en push a main)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach

      - name: Verify deployment health
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "⏳ Esperando que los servicios estén healthy..."
          sleep 30
          railway status
